name: Release

on:
  push:
    branches:
      - main
    paths:
      - module.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version module.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Repile.zip
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p build/Repile
          git archive HEAD | tar -x -C build/Repile
          rm -rf build/Repile/.github
          cd build && zip -qr ../Repile.zip Repile

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" Repile.zip module.json \
            --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
